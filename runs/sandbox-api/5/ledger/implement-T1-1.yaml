summary: 'T1 is done. All 13 card-check messages now sit in one table, `FIELD_MESSAGES`
  in payments/cards.py, and `validate_card` takes its texts only from it. `docs/field-messages.md`
  lists them word for word with the rules, and the README links it. The full suite
  passes (138 tests, 10 of them new). I also broke one word in the document on purpose,
  and the document test failed as it should. No message text changed, so the existing
  API and service tests still pass.


  The table is keyed by (field, code, variant). The variant is None except for the
  security code length message, which has three: `amex`, `other_brands` (visa, mastercard,
  discover, or a number that passes the check but starts like no known brand) and
  `brand_unknown` (number missing or malformed). A small helper, `field_error(field,
  code, variant=None)`, builds a FieldError from the table. The texts and rules match
  the `messages` list in contract.yaml.


  The document has a Messages table with the columns Field, Code, Brand, Message and
  Rule. Messages are in backticks, which the test strips before comparing. It also
  has a section on the brand rule and a note on what is not in the table (the `validation_failed`
  summary sentence and decline messages). The README gained a short "Field messages"
  section and a link from the `validation_failed` row.


  The new tests in tests/test_cards.py check these things:

  - The table covers exactly the field and code pairs and the three variants, in field
  order, with distinct plain texts.

  - Every message that `validate_card` returns is in the table. This runs over a product
  of about 9x14x11x9 inputs for name, number, expiry and security code.

  - Every table message can be returned by some input.

  - The security code variant follows the brand.

  - The document''s table equals `FIELD_MESSAGES` exactly (field, code, brand, message,
  in order), and every row has a rule.

  - The README links the document, and no quoted sentence in the document is outside
  the table.


  I could not check a few things:

  - The tests call `validate_card` directly. They do not go through the HTTP layer,
  which only maps `FieldError` to `{field, code, message}`.

  - The web checkout is not touched.


  Nothing outside my files looked wrong.'
