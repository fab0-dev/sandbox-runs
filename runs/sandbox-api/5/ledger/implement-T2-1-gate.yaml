summary: 'The change touches only the unit''s two files, payments/api.py and tests/test_api.py
  (git diff --name-only origin/fab0/5/base...fab0/5/implement-T2).; The new CrossOriginApiTest
  class in tests/test_api.py does what a browser on another origin does. It sends
  an Origin header. It sends preflights for POST /payments and GET /orders/{order_reference}/payments
  with Access-Control-Request-Headers ''content-type,idempotency-key'' in several
  cases, orders and spacings. It checks the preflight answer against contract.yaml
  cross_origin: an empty 204 with Allow-Origin ''*'', Allow-Methods ''GET, POST, OPTIONS'',
  Allow-Headers ''Content-Type, Idempotency-Key'', Max-Age 600, Expose-Headers ''Idempotency-Replayed'',
  and no Allow-Credentials. A preflight on an unknown path gets a 404 that still carries
  the headers.; Every Pay order answer the task lists (201, 200 replay, 404, 405,
  409, 422, 400, 500) is checked for Access-Control-Allow-Origin and Access-Control-Expose-Headers:
  Idempotency-Replayed. So are the Order payment status answers (200, 404, 405, 500).
  Idempotency-Replayed is ''true'' only on the 200 replay, as the contract says. The
  replay test checks that the header is exposed, that the replayed body equals the
  first body, and that only one attempt is recorded (D9).; The fix in payments/api.py:102-106
  is right and is needed. I ran the base and the new api.py against the raw request
  line ''GET /payments HTTP/x.y''. Base answered with a bare JSON body and no status
  line or headers, because http.server leaves request_version at HTTP/0.9. The new
  code answers ''HTTP/1.1 400'' with both CORS headers. The fix only changes send_error,
  so normal answers are unaffected.; Checks: python3 -m unittest discover -s tests
  -t . passes 146 tests, run 3 times. CrossOriginApiTest passed 40 times in a row
  with no flaky failures, including the raw-socket tests. The worktree is clean.'
verdict:
  decision: approve
  reasons:
  - The change touches only the unit's two files, payments/api.py and tests/test_api.py
    (git diff --name-only origin/fab0/5/base...fab0/5/implement-T2).
  - 'The new CrossOriginApiTest class in tests/test_api.py does what a browser on
    another origin does. It sends an Origin header. It sends preflights for POST /payments
    and GET /orders/{order_reference}/payments with Access-Control-Request-Headers
    ''content-type,idempotency-key'' in several cases, orders and spacings. It checks
    the preflight answer against contract.yaml cross_origin: an empty 204 with Allow-Origin
    ''*'', Allow-Methods ''GET, POST, OPTIONS'', Allow-Headers ''Content-Type, Idempotency-Key'',
    Max-Age 600, Expose-Headers ''Idempotency-Replayed'', and no Allow-Credentials.
    A preflight on an unknown path gets a 404 that still carries the headers.'
  - 'Every Pay order answer the task lists (201, 200 replay, 404, 405, 409, 422, 400,
    500) is checked for Access-Control-Allow-Origin and Access-Control-Expose-Headers:
    Idempotency-Replayed. So are the Order payment status answers (200, 404, 405,
    500). Idempotency-Replayed is ''true'' only on the 200 replay, as the contract
    says. The replay test checks that the header is exposed, that the replayed body
    equals the first body, and that only one attempt is recorded (D9).'
  - The fix in payments/api.py:102-106 is right and is needed. I ran the base and
    the new api.py against the raw request line 'GET /payments HTTP/x.y'. Base answered
    with a bare JSON body and no status line or headers, because http.server leaves
    request_version at HTTP/0.9. The new code answers 'HTTP/1.1 400' with both CORS
    headers. The fix only changes send_error, so normal answers are unaffected.
  - 'Checks: python3 -m unittest discover -s tests -t . passes 146 tests, run 3 times.
    CrossOriginApiTest passed 40 times in a row with no flaky failures, including
    the raw-socket tests. The worktree is clean.'
