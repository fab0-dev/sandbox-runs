    is no code yet, so there were no tests to run. jsonschema is not installed, so
    I could not validate the contract against a schema, as the producer also reported.'
  findings:
  - check: cors
    message: 'The preflight advertises `Access-Control-Allow-Methods: GET, POST, OPTIONS`
      for /orders/{order_reference}/payments too, although that path supports only
      GET and a POST there is a 405. This is harmless, but T3 could send per-path
      methods.'
    location: contract.yaml:159
  - check: interface completeness
    message: The contract does not say which refusal (presumably invalid_request)
      answers an Idempotency-Key that is empty or longer than 255 characters. T3 has
      to pick one.
    location: contract.yaml:12
  - check: interface completeness
    message: 'The contract does not say what happens when `card` is missing or is
      not an object: either validation_failed listing every field as required, or
      invalid_request. T3 and the web team should agree on one.'
    location: contract.yaml:24
  - check: style
    message: The YAML anchor `&payment` is defined but never used, because the declined
      branch describes the shape in words. This is harmless.
    location: contract.yaml:34
