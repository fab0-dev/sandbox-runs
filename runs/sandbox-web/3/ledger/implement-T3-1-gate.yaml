  findings:
  - check: spec
    message: When a local check blocks the submit, the card number and security code
      are not cleared. The title says 'after each attempt', and nothing is sent in
      this case, so this is a reasonable reading. It is documented in the README,
      and a person can confirm it.
    location: src/checkout.js:207
  - check: tests
    message: The page binding is tested against a stand-in DOM, not a real browser
      or the real service, so this change has not been run end to end. The producer
      says so.
    location: tests/checkout.test.js:457
  - check: contract
    message: If Pay order returns an error and the status read then says the order
      is unpaid, the next submit uses a new Idempotency-Key, not the original one.
      The service serialises attempts per order, so this is safe, but it does not
      reuse keys on resend as the contract suggests.
    location: src/checkout.js:251
