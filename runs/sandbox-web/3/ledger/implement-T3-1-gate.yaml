summary: 'The change touches only the six files T3 lists: README.md, checkout.html,
  index.html, src/checkout.js, styles.css and tests/checkout.test.js. All six are
  new or added to, and no T1 or T2 file is modified.; It covers everything in the
  T3 title. The order comes from the URL and is validated. The order''s payment status
  loads first, and a paid order shows as paid with no form. The submit lock is set
  before any await, and the fieldset and button are disabled while processing (D7).
  A success shows paid, the amount charged from the returned payment, and brand with
  last four digits (D2). A decline shows the service''s message as sent, on the same
  page, with data-reason set and the form ready to retry (D3, D5). Field errors from
  validateCard and from the service''s validation_failed land in the same places (D4).
  order_already_paid shows the order as paid with the service''s message (D6). The
  card number and security code are cleared in a finally after every attempt that
  was sent.; It matches the upstream contract through the T2 client. It tells succeeded,
  declined, refused and error apart, shows the message rather than hard-coding the
  decline wording, and keys styling on decline_reason. After a failure with no usable
  answer it reads order_payment_status before allowing another submit, as other_errors
  asks. Each submit gets a fresh Idempotency-Key.; `npm test` in the implement-T3
  worktree gives 81 pass, 0 fail, 0 skipped.'
