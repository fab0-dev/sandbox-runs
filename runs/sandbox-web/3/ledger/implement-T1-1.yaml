summary: 'T1 is done. `validateCard(card, now = new Date())` in `src/card-validation.js`
  checks card details in the browser and returns `{valid, errors}`. `errors` has at
  most one `{field, code, message}` per invalid field, in the order cardholder_name,
  number, expiry, security_code. Field and code names are the service''s validation_failed
  names (required, invalid_format, invalid_number, expired, invalid_length), so T3
  can show local and service errors the same way. The 24 tests in `tests/card-validation.test.js`
  pass with `npm test`. No browser run was done, but the module uses no Node-specific
  APIs.


  The checks:

  - **Name:** required, at most 100 characters.

  - **Number:** required. Spaces and dashes are ignored. It must be 12 to 19 digits
  and pass the Luhn check digit.

  - **Expiry:** month and year both required. Month is 1 to 12. Year is 2 or 4 digits,
  and 2 digits means 20xx. It is expired only if its month is before the current month,
  so a card works through its last month. The current month is taken in UTC, like
  the service. Values can be form strings or numbers.

  - **Security code:** required, digits only. When the number is readable, it must
  be 4 digits for an Amex number and 3 otherwise. When the number is missing or malformed,
  3 or 4 digits are accepted so one number typo does not also flag the code. The service
  still checks by brand.

  - **Other exports:** `passesLuhn`, `detectBrand`, `FIELDS` and `CODES`.

  - **Card data (D10):** the module keeps and logs nothing, and no message contains
  any part of the number or the code. A test checks this.


  `package.json` is new, since the repo had none. It sets `"type": "module"` so the
  source loads as an ES module in the browser (`<script type="module">`) and in Node.
  The test script is `node --test "tests/**/*.test.js"`, which also picks up T2 and
  T3 tests. The tests ran on Node v24.13.0.


  Nothing found outside my files that needs fixing.'
