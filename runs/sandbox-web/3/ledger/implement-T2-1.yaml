summary: 'Added the payments API client for T2, with 22 passing tests. I ran them
  with `node --test tests/payments-api.test.js` on Node 24.13. The directory form
  `node --test tests/` failed to find the tests, so name the file or use a glob. The
  code is plain ES modules, so it loads in the browser with `<script type="module">`.


  src/config.js holds the base URL in one place. The default is `http://127.0.0.1:8000`,
  from the contract notes. It can be changed with `window.CHECKOUT_CONFIG = { paymentsBaseUrl
  }` set before the scripts load, or with `setPaymentsBaseUrl(url)`. Trailing slashes
  are stripped, and the URL is read at each call.


  src/payments-api.js exports `payOrder(request, {idempotencyKey, signal})`, `getOrderPaymentStatus(orderReference,
  {signal})`, `newIdempotencyKey()` and `createPaymentsApi({fetch, baseUrl})`. The
  last one is for tests. `payOrder` takes `{ orderReference, amount, currency, card:
  { cardholderName, number, expiryMonth, expiryYear, securityCode } }`. Calls resolve
  to an object instead of throwing, and `kind` tells the cases apart:

  - `succeeded`: `{ payment, orderPaid: true, replayed, idempotencyKey }`.

  - `declined`: `{ payment, orderPaid: false, replayed, idempotencyKey }`. `payment.decline_reason`
  and `payment.message` give the reason and the text to show.

  - `refused`: `{ status, code, message, fields, fieldErrors, orderReference }`. `code`
  is `validation_failed`, `invalid_amount`, `invalid_request`, `order_already_paid`
  or `idempotency_key_reused`. `fields` is `[{field, code, message}]` and `fieldErrors`
  maps field to message. They appear only for `validation_failed`. `orderReference`
  appears only for `order_already_paid`.

  - `error`: `{ status, code, message }` for `network_error`, `internal_error`, `unexpected_response`
  and similar. The attempt may or may not have been recorded, so read the order status
  before submitting again.


  `getOrderPaymentStatus` returns `{ kind: ''ok'', orderReference, paid, payments
  }` or a `kind: ''error''` object. An order with no attempts comes back as unpaid
  with an empty list.


  What the client does beyond the contract:

  - The `Idempotency-Key` header is always sent. If the caller gives no key, a fresh
  one is made and returned as `idempotencyKey`. T3 should make one key per form submit
  and pass the same key only when resending that submit.

  - Expiry month and year, and the amount, are sent as integers when the form gives
  digit strings. Anything else is sent as it is, so the service refuses it.

  - Card data (D10): the card number and security code go only in the body of the
  one `POST /payments`. They are not logged, not stored, not in the URL or headers,
  and not kept in module state. Payments that come back are copied field by field,
  so only brand and last4 remain, even if a service wrongly echoes the card. Error
  messages for network and unreadable answers are fixed text.

  - The `payment` objects keep the contract''s snake_case names. Only the wrapper
  fields are camelCase.

  - If the caller aborts a request, the abort error is thrown, so T3 can tell it apart
  from a service answer.


  Tests cover the request shape, all three answer kinds, all five decline reasons,
  every refusal, 500, network and malformed answers, replay, the base URL settings,
  and the D10 checks.


  Not mine: `package.json` is T1''s file and does not exist on this branch. The code
  is ES modules, and Node loaded it and ran the tests without it. If T1''s package.json
  sets `"type": "commonjs"`, these files will need `"type": "module"` or `.mjs` names.
  T1 should use ES modules too so the browser and tests share one style.'
